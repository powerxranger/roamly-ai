[project]
name = "roamly-ai"
version = "0.1.0"
description = "Roamly AI - Multi-Agent Travel Planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.17",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "mcp>=1.29.1",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tavily>=1.1.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
